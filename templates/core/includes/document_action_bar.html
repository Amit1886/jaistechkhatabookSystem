<div
  class="doc-action-bar"
  data-doc-action-bar
  {% if doc_title %}data-doc-title="{{ doc_title }}"{% endif %}
  {% if doc_share_text %}data-doc-share-text="{{ doc_share_text }}"{% endif %}
  {% if doc_pdf_url %}data-doc-pdf-url="{{ doc_pdf_url }}"{% endif %}
  {% if doc_pdf_inline_url %}data-doc-pdf-inline-url="{{ doc_pdf_inline_url }}"{% endif %}
>
  {% if receipt_reference_type and receipt_reference_id %}
    <a class="doc-btn" href="{% url 'ledger:receipt' %}?reference_type={{ receipt_reference_type|urlencode }}&reference_id={{ receipt_reference_id }}{% if receipt_voucher_type %}&voucher_type={{ receipt_voucher_type|urlencode }}{% endif %}{% if receipt_kind %}&kind={{ receipt_kind|urlencode }}{% endif %}" target="_blank" rel="noopener">
      <i class="bi bi-receipt"></i> Receipt
    </a>
    <a class="doc-btn" href="{% url 'ledger:receipt' %}?reference_type={{ receipt_reference_type|urlencode }}&reference_id={{ receipt_reference_id }}{% if receipt_voucher_type %}&voucher_type={{ receipt_voucher_type|urlencode }}{% endif %}{% if receipt_kind %}&kind={{ receipt_kind|urlencode }}{% endif %}&format=pdf" target="_blank" rel="noopener">
      <i class="bi bi-filetype-pdf"></i> Receipt PDF
    </a>
  {% endif %}
  <button type="button" class="doc-btn" data-doc-act="print"><i class="bi bi-printer"></i> Print</button>
  <button type="button" class="doc-btn" data-doc-act="pdf"><i class="bi bi-filetype-pdf"></i> PDF</button>
  <button type="button" class="doc-btn" data-doc-act="download"><i class="bi bi-download"></i> Download</button>
  <button type="button" class="doc-btn" data-doc-act="share"><i class="bi bi-share"></i> Share</button>
  <button type="button" class="doc-btn" data-doc-act="email"><i class="bi bi-envelope"></i> Email</button>
  <button type="button" class="doc-btn" data-doc-act="sms"><i class="bi bi-chat-dots"></i> SMS</button>
  <button type="button" class="doc-btn" data-doc-act="wa"><i class="bi bi-whatsapp"></i> WhatsApp</button>
  <button type="button" class="doc-btn" data-doc-act="scan"><i class="bi bi-upc-scan"></i> Scan</button>
</div>
<script>
  (function () {
    function notify(message, type) {
      window.dispatchEvent(
        new CustomEvent('ui:toast', {
          detail: { message: message, type: type || 'info' }
        })
      );
    }

    if (!window.__docActionHandlerBound) {
      document.addEventListener('click', async function (event) {
        const btn = event.target.closest('[data-doc-act]');
        if (!btn) return;

        const action = btn.getAttribute('data-doc-act');
        const bar = btn.closest('[data-doc-action-bar]');
        const pageUrl = window.location.href;
        const title = (bar && bar.getAttribute('data-doc-title')) || document.title || 'Document';
        const shareText = (bar && bar.getAttribute('data-doc-share-text')) || '';
        const pdfUrlRaw = (bar && bar.getAttribute('data-doc-pdf-url')) || '';
        const pdfInlineRaw = (bar && bar.getAttribute('data-doc-pdf-inline-url')) || '';

        const pdfUrl = pdfUrlRaw ? new URL(pdfUrlRaw, window.location.origin).href : '';
        const pdfInlineUrl = (pdfInlineRaw || pdfUrlRaw) ? new URL((pdfInlineRaw || pdfUrlRaw), window.location.origin).href : '';

        function buildShareBody() {
          if (shareText) return shareText;
          const parts = [title, pageUrl];
          if (pdfInlineUrl) parts.push('PDF: ' + pdfInlineUrl);
          return parts.join('\n');
        }

        if (action === 'print') {
          window.print();
          notify('Print dialog opened.', 'success');
          return;
        }

        if (action === 'pdf') {
          if (pdfInlineUrl) {
            window.open(pdfInlineUrl, '_blank', 'noopener');
            notify('PDF opened.', 'success');
            return;
          }
          window.print();
          notify('Print dialog opened for PDF save.', 'success');
          return;
        }

        if (action === 'download') {
          if (pdfUrl) {
            window.open(pdfUrl, '_blank', 'noopener');
            notify('Download started.', 'success');
            return;
          }
          if (pdfInlineUrl) {
            window.open(pdfInlineUrl, '_blank', 'noopener');
            notify('PDF opened.', 'success');
            return;
          }
          window.print();
          notify('Print dialog opened.', 'success');
          return;
        }

        if (action === 'email') {
          window.location.href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(pageUrl);
          return;
        }

        if (action === 'sms') {
          window.location.href = 'sms:?&body=' + encodeURIComponent(title + ' - ' + pageUrl);
          return;
        }

        if (action === 'wa') {
          window.open('https://wa.me/?text=' + encodeURIComponent(buildShareBody()), '_blank', 'noopener');
          return;
        }

        if (action === 'scan') {
          window.dispatchEvent(new CustomEvent('global:scan:trigger'));
          notify('Scanner trigger sent.', 'info');
          return;
        }

        if (action === 'share') {
          if (navigator.share) {
            try {
              await navigator.share({ title: title, text: buildShareBody(), url: pageUrl });
            } catch (err) {
              // ignored
            }
            return;
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              const body = buildShareBody();
              await navigator.clipboard.writeText(body);
              notify('Copied to clipboard.', 'success');
            } catch (err) {
              notify('Unable to copy link.', 'error');
            }
          }
        }
      });

      window.__docActionHandlerBound = true;
    }
  })();
</script>
