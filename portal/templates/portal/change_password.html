{% extends "portal/base_portal.html" %}
{% load static %}

{% block content %}
<div class="container-fluid py-2 unified-screen">
  <div class="unified-card" style="max-width:720px;margin:0 auto;">
    <div class="unified-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h3 class="mb-0">Change Password</h3>
        <div class="unified-subtitle">For your security, set a new portal password</div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="{% url 'portal:logout' %}" class="btn unified-btn-outline">Logout</a>
      </div>
    </div>

    <div class="unified-body">
      <form method="post" class="unified-grid cols-2">
        {% csrf_token %}
        <div class="unified-section">
          <label class="unified-label">Current Password</label>
          <input type="password" name="current_password" class="form-control" required>
        </div>
        <div class="unified-section">
          <label class="unified-label">New Password</label>
          <input type="password" name="new_password" class="form-control" minlength="8" required>
          <div class="small text-muted mt-1">Minimum 8 characters.</div>
        </div>
        <div class="unified-section">
          <label class="unified-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" minlength="8" required>
        </div>

        <div class="unified-section">
          <label class="unified-label">Account</label>
          <div class="small text-muted">
            {{ portal_user.party.name }} • {{ portal_user.role|title }} • {{ portal_user.username }}
          </div>
        </div>

        <div class="unified-section" style="grid-column:1/-1;">
          <button type="submit" class="btn unified-btn-primary w-100">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
