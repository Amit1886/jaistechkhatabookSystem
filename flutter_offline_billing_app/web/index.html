<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Billentra Enterprise Super App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Billentra">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Billentra Enterprise Super App</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #040a12;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 10%, rgba(16,185,129,.2), transparent 32%),
        radial-gradient(circle at 80% 0%, rgba(37,99,235,.24), transparent 30%),
        #040a12;
    }
    .loader-card {
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #10b981, #2563eb);
      font-weight: 900;
      font-size: 24px;
    }
    .loader-card h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .loader-card p {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-card">
      <div class="logo">B</div>
      <h1>Billentra Super App</h1>
      <p>Starting Flutter enterprise workspace...</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
