<div class="wa-dashboard-wrap" data-owner="{{ request.user.id }}">
  <div class="wa-dashboard-header">
    <div class="wa-dashboard-title">
      <span class="wa-dashboard-title-icon"><i class="bi bi-whatsapp"></i></span>
      <div>
        <h3>WhatsApp Orders</h3>
        <p>Live orders captured from WhatsApp messages.</p>
      </div>
    </div>
    <a href="{% url 'commerce:whatsapp_order_inbox' %}" class="summary-modern-btn">
      <i class="bi bi-inbox" aria-hidden="true"></i>
      <span>Open Inbox</span>
    </a>
  </div>

  <div class="wa-cards-grid">
    <div class="wa-card">
      <span class="wa-card-icon"><i class="bi bi-chat-dots"></i></span>
      <div class="wa-card-label">Orders Today</div>
      <div class="wa-card-value" data-wa="total_orders">0</div>
      <div class="wa-card-meta">Auto-updated every 10s</div>
    </div>
    <div class="wa-card">
      <span class="wa-card-icon"><i class="bi bi-cash-coin"></i></span>
      <div class="wa-card-label">WhatsApp Sales</div>
      <div class="wa-card-value" data-wa="total_sales">Rs. 0</div>
      <div class="wa-card-meta">Todays total</div>
    </div>
    <div class="wa-card">
      <span class="wa-card-icon"><i class="bi bi-bag-check"></i></span>
      <div class="wa-card-label">Latest Order</div>
      <div class="wa-card-value" data-wa="latest_order">-</div>
      <div class="wa-card-meta">Tap to open details</div>
    </div>
  </div>

  <div class="wa-slider">
    <div class="wa-slide-track">
      <div class="wa-slide">
        <div class="wa-slide-label">WhatsApp Orders Today</div>
        <div class="wa-slide-value" data-wa="slide_orders">0</div>
      </div>
      <div class="wa-slide">
        <div class="wa-slide-label">Total WhatsApp Sales</div>
        <div class="wa-slide-value" data-wa="slide_sales">Rs. 0</div>
      </div>
      <div class="wa-slide">
        <div class="wa-slide-label">Latest Order</div>
        <div class="wa-slide-value" data-wa="slide_latest">-</div>
      </div>
    </div>
    <div class="wa-slider-controls">
      <button type="button" class="wa-slider-btn" data-dir="-1">Prev</button>
      <button type="button" class="wa-slider-btn" data-dir="1">Next</button>
    </div>
  </div>

  <div class="wa-order-list">
    <div class="wa-list-head">Latest Orders</div>
    <div class="wa-list-body" data-wa="order_list">
      <div class="wa-empty">No orders yet.</div>
    </div>
  </div>
</div>

<style>
.wa-dashboard-wrap {
  position: relative;
  overflow: hidden;
  margin: 18px 0;
  background:
    linear-gradient(135deg, rgba(37, 211, 102, 0.1), rgba(2, 132, 199, 0.07)),
    #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 18px;
}
.wa-dashboard-wrap::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, #25d366, #0f766e, #0284c7);
}
body.dark .wa-dashboard-wrap {
  background:
    linear-gradient(135deg, rgba(37, 211, 102, 0.08), rgba(56, 189, 248, 0.08)),
    #0b1220;
  border-color: #1f2937;
}
.wa-dashboard-header {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}
.wa-dashboard-title {
  display: flex;
  align-items: center;
  gap: 12px;
}
.wa-dashboard-title-icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(37, 211, 102, 0.14);
  color: #0f766e;
  font-size: 19px;
  box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.14);
  flex: 0 0 auto;
}
.wa-dashboard-header .summary-modern-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 10px;
}
.wa-dashboard-header h3 {
  margin: 0;
  font-size: 20px;
}
.wa-dashboard-header p {
  margin: 4px 0 0 0;
  font-size: 12px;
  color: #6b7280;
}
.wa-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.wa-card {
  position: relative;
  min-height: 104px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 14px 14px 14px 58px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}
.wa-card:hover {
  transform: translateY(-2px);
  border-color: rgba(15, 118, 110, 0.24);
  box-shadow: 0 16px 30px rgba(15, 23, 42, 0.1);
}
.wa-card-icon {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #dcfce7;
  color: #15803d;
  font-size: 16px;
}
body.dark .wa-card {
  background: rgba(15, 23, 42, 0.88);
  border-color: #1f2937;
  color: #e5e7eb;
}
.wa-card-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6b7280;
}
.wa-card-value {
  font-size: 24px;
  font-weight: 900;
  margin-top: 6px;
}
.wa-card-meta {
  font-size: 11px;
  color: #6b7280;
}
.wa-slider {
  margin-top: 14px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
}
body.dark .wa-slider {
  background: rgba(15, 23, 42, 0.88);
  border-color: #1f2937;
}
.wa-slide-track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 100%;
  transition: transform 0.4s ease;
}
.wa-slide {
  padding: 14px 16px;
}
.wa-slide-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6b7280;
  margin-bottom: 6px;
}
.wa-slide-value {
  font-size: 22px;
  font-weight: 700;
  color: #15803d;
}
.wa-slider-controls {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px 12px;
  border-top: 1px solid #e5e7eb;
}
.wa-slider-btn {
  background: #ffffff;
  border: 1px solid #dbe3ef;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
}
.wa-order-list {
  margin-top: 12px;
}
.wa-list-head {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6b7280;
  margin-bottom: 6px;
}
.wa-list-row {
  display: grid;
  grid-template-columns: 120px 1fr 120px 120px;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 12px;
  align-items: center;
}
.wa-order-btn {
  background: #0f766e;
  color: #ffffff;
  border: none;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 800;
}
.wa-empty {
  font-size: 12px;
  color: #6b7280;
  padding: 6px 0;
}
@media (max-width: 720px) {
  .wa-dashboard-header {
    align-items: stretch;
  }
  .wa-dashboard-header .summary-modern-btn {
    width: 100%;
  }
  .wa-list-row {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
(function () {
  const wrap = document.querySelector('.wa-dashboard-wrap');
  if (!wrap) return;

  const track = wrap.querySelector('.wa-slide-track');
  let slideIndex = 0;

  function formatCurrency(value) {
    return 'Rs. ' + Number(value || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }

  function setText(selector, value) {
    const el = wrap.querySelector(selector);
    if (el) el.textContent = value;
  }

  function renderOrders(orders) {
    const container = wrap.querySelector('[data-wa="order_list"]');
    if (!container) return;
    if (!orders || orders.length === 0) {
      container.innerHTML = '<div class="wa-empty">No orders yet.</div>';
      return;
    }
    container.innerHTML = orders.map(o => `
      <div class="wa-list-row">
        <button class="wa-order-btn" onclick="window.location.href='/commerce/orders/sales/${o.id}/'">${o.order_no}</button>
        <div>${o.customer_name}</div>
        <div>${o.mobile || '-'}</div>
        <div>${formatCurrency(o.total)}</div>
      </div>
    `).join('');
  }

  function fetchLive() {
    if (document.hidden) return;

    // Cancel any in-flight request so reload/shutdown doesn't get stuck waiting.
    if (window.__waLiveAbort) {
      try { window.__waLiveAbort.abort(); } catch (e) {}
    }

    const controller = new AbortController();
    window.__waLiveAbort = controller;
    const timeout = setTimeout(() => {
      try { controller.abort(); } catch (e) {}
    }, 5000);

    fetch('/api/orders/live-feed/', { signal: controller.signal, cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        setText('[data-wa="total_orders"]', data.total_orders_today || 0);
        setText('[data-wa="total_sales"]', formatCurrency(data.total_sales_today || 0));
        if (data.latest_orders && data.latest_orders[0]) {
          setText('[data-wa="latest_order"]', data.latest_orders[0].order_no);
          setText('[data-wa="slide_latest"]', data.latest_orders[0].order_no);
        }
        setText('[data-wa="slide_orders"]', data.total_orders_today || 0);
        setText('[data-wa="slide_sales"]', formatCurrency(data.total_sales_today || 0));
        renderOrders(data.latest_orders || []);
      })
      .catch((err) => {
        if (err && err.name === 'AbortError') return;
        setText('[data-wa="total_orders"]', '');
        setText('[data-wa="total_sales"]', '');
      })
      .finally(() => {
        clearTimeout(timeout);
      });
  }

  function moveSlide(dir) {
    const slides = track ? track.children.length : 0;
    if (!slides) return;
    slideIndex = (slideIndex + dir + slides) % slides;
    track.style.transform = `translateX(-${slideIndex * 100}%)`;
  }

  wrap.querySelectorAll('.wa-slider-btn').forEach(btn => {
    btn.addEventListener('click', () => moveSlide(parseInt(btn.dataset.dir || '1', 10)));
  });

  let intervalId = null;
  function startLive() {
    if (intervalId) return;
    fetchLive();
    intervalId = setInterval(fetchLive, 10000);
  }
  function stopLive() {
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
    }
    if (window.__waLiveAbort) {
      try { window.__waLiveAbort.abort(); } catch (e) {}
      window.__waLiveAbort = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLive();
    else startLive();
  });
  window.addEventListener('pagehide', stopLive);
  window.addEventListener('beforeunload', stopLive);

  function isDesktopExeMode() {
    try {
      return String(document.body.dataset.systemMode || "").toUpperCase().indexOf("DESKTOP") !== -1;
    } catch (e) {
      return false;
    }
  }

  // Desktop EXE: reduce background polling to minimize SQLite churn on Windows.
  if (!isDesktopExeMode()) startLive();
})();
</script>
