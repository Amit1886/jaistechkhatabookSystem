{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
  <div class="unified-list-card" style="max-width: 820px; margin: 0 auto;">
    <div class="unified-list-header d-flex justify-content-between align-items-center">
      <div>
        <h3>Delete Coupon</h3>
        <div class="unified-subtitle">This action cannot be undone.</div>
      </div>
      <a href="{% url 'commerce:coupon_list' %}" class="btn unified-btn-outline">Back</a>
    </div>
    <div class="unified-list-body">
      <div class="alert alert-warning">
        Are you sure you want to delete <strong>{{ coupon.code }}</strong> ({{ coupon.title }})?
      </div>
      <form method="post" class="d-flex gap-2 justify-content-end">
        {% csrf_token %}
        <a href="{% url 'commerce:coupon_list' %}" class="btn unified-btn-outline">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
