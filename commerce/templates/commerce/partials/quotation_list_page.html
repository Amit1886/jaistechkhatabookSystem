<div class="container-fluid py-2 unified-list-screen" data-ajax-list-wrap data-ajax-url="{{ request.path }}" data-export-scope>
  <div class="unified-list-card">
    <div class="unified-list-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h3>Quotation List</h3>
        <div class="unified-subtitle">Draft → Sent → Verified → Approved → Converted</div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="{% url 'commerce:quotation_create' %}" class="btn unified-btn-primary">Add Quotation</a>
        <a href="{% url 'commerce:order_list' %}" class="btn unified-btn-outline">Orders</a>
        <button type="button" class="btn unified-btn-outline" data-export="print" data-export-table="#quotationTable" data-export-name="quotations">Print</button>
        <button type="button" class="btn unified-btn-outline" data-export="excel" data-export-table="#quotationTable" data-export-name="quotations">Excel</button>
        <button type="button" class="btn unified-btn-outline" data-export="pdf" data-export-table="#quotationTable">PDF</button>
      </div>
    </div>

    <div class="unified-list-body">
      <form class="unified-filter-row d-flex flex-wrap gap-2 align-items-end mb-2" data-ajax-form>
        <div class="flex-grow-1" style="min-width:220px;">
          <label class="unified-label" for="quoteQ">Search</label>
          <input id="quoteQ" name="q" value="{{ q }}" type="text" class="form-control" placeholder="Quotation no / party / remarks">
        </div>

        <div style="min-width:190px;">
          <label class="unified-label" for="quoteStatus">Status</label>
          <select id="quoteStatus" name="status" class="form-select">
            <option value="">All</option>
            <option value="draft" {% if status == 'draft' %}selected{% endif %}>Draft</option>
            <option value="sent" {% if status == 'sent' %}selected{% endif %}>Sent</option>
            <option value="verified" {% if status == 'verified' %}selected{% endif %}>Verified</option>
            <option value="approved" {% if status == 'approved' %}selected{% endif %}>Approved</option>
            <option value="rejected" {% if status == 'rejected' %}selected{% endif %}>Rejected</option>
            <option value="converted" {% if status == 'converted' %}selected{% endif %}>Converted</option>
          </select>
        </div>

        <div style="min-width:160px;">
          <label class="unified-label" for="fromDate">From</label>
          <input id="fromDate" name="from" type="date" class="form-control" value="{{ date_from|date:'Y-m-d' }}">
        </div>
        <div style="min-width:160px;">
          <label class="unified-label" for="toDate">To</label>
          <input id="toDate" name="to" type="date" class="form-control" value="{{ date_to|date:'Y-m-d' }}">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn unified-btn-primary">Apply</button>
          <button type="button" class="btn unified-btn-outline" data-ajax-reset>Reset</button>
        </div>
      </form>

      <div class="small text-muted mb-2" data-ajax-loading style="display:none;">Loading…</div>

      <div class="unified-table-wrap">
        <table class="table unified-table" id="quotationTable">
          <thead>
            <tr>
              <th>Quotation No</th>
              <th>Party</th>
              <th>Date</th>
              <th>Valid Till</th>
              <th class="text-end">Total</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody data-ajax-tbody>
            {% include "commerce/partials/quotation_list_rows.html" %}
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end mt-2" data-ajax-pagination>
        {% include "core/includes/ajax_pagination.html" with page_obj=page_obj %}
      </div>
    </div>
  </div>
</div>
