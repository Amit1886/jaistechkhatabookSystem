{% extends "content_studio/base.html" %}
{% block title %}Design From Product{% endblock %}
{% block header_title %}Design From Product{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">Create Design for Product #{{ product_id }}</div>
                <form method="post" class="card-body">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" value="Design for Product" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Width (px)</label>
                            <input type="number" name="width" class="form-control" value="1080">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Height (px)</label>
                            <input type="number" name="height" class="form-control" value="1080">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'content_studio:dashboard' %}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create &amp; Edit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
