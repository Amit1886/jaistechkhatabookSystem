{% extends "storefront/vendor_admin_shell.html" %}

{% block vendor_content %}
  <div class="va-panel p-3 mb-3">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <div class="va-section-title">Taxes & duties</div>
        <div class="va-help">Tax display settings for storefront pricing.</div>
      </div>
    </div>
  </div>

  <form method="post" class="va-panel p-3">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="va-section-title mb-2">Price display</div>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" value="true" name="tax_included_in_prices" id="taxInc"
                 {% if tax_included_in_prices %}checked{% endif %}>
          <label class="form-check-label va-form-label" for="taxInc">Prices include tax</label>
        </div>
        <div class="va-help mt-1">If enabled, storefront prices are treated as tax-inclusive.</div>
      </div>
      <div class="col-12 d-flex justify-content-end gap-2">
        <button class="btn btn-primary" type="submit"><i class="bi bi-check2-circle me-1"></i>Save</button>
      </div>
    </div>
  </form>
{% endblock %}
