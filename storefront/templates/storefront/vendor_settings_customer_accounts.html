{% extends "storefront/vendor_admin_shell.html" %}

{% block vendor_content %}
  <div class="va-panel p-3 mb-3">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <div class="va-section-title">Customer accounts</div>
        <div class="va-help">Login, registration and customer visibility rules.</div>
      </div>
    </div>
  </div>

  <div class="va-panel p-3">
    <div class="va-help">
      This demo uses the platform login flow. Customer account behavior is controlled from
      <span class="fw-semibold">Checkout</span> settings.
    </div>
    <div class="mt-3">
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'vendor-settings-checkout' vendor.subdomain %}">
        <i class="bi bi-bag-check me-1"></i>Open checkout settings
      </a>
    </div>
  </div>
{% endblock %}
